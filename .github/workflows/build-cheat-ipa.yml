# Build the ForgeTaxCheat dylib and inject it into the base 3.16.1 IPA.
# The base IPA is downloaded from Google Drive (the cloud browser cannot
# attach 150 MB files to a GitHub release — no file picker), and the
# finished IPA is published as a release on this repo by the workflow
# itself (gh release create, GITHUB_TOKEN). The artifact upload is kept
# as a backup.
#
# Hard guarantees:
#  - UnityFramework is NEVER modified: its SHA-256 is asserted identical
#    before injection and after repacking; any difference fails the job.
#  - The dylib is built directly with clang++ (no Xcode project to drift).
#    clang++ (not clang): the .mm sources use C++ exceptions (try/catch in
#    GameBridge), so the C++ runtime (libc++) must be linked in.
#  - patch_table.h must be in sync with patch_table_verified.json
#    (regenerated and diffed); a drift fails the job.
name: build-cheat-ipa

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check patch_table.h is in sync with the verified JSON
        run: |
          python3 scripts/patch_table_to_header.py patch_table_verified.json /tmp/patch_table_check.h
          diff -u src/patch_table.h /tmp/patch_table_check.h

      - name: Build ForgeTaxCheat.dylib (arm64, iOS 15.0)
        run: |
          xcrun --sdk iphoneos clang++ -arch arm64 -mios-version-min=15.0 \
            -dynamiclib -fobjc-arc -O2 -Wall \
            -install_name @executable_path/Frameworks/ForgeTaxCheat.dylib \
            -framework Foundation -framework UIKit \
            -framework CoreGraphics -framework QuartzCore \
            src/ForgeTaxCheat.mm src/CheatMenuView.mm \
            src/PatchEngine.mm src/GameBridge.mm \
            -o ForgeTaxCheat.dylib
          file ForgeTaxCheat.dylib
          lipo -info ForgeTaxCheat.dylib

      - name: Download base IPA (Google Drive)
        run: |
          URL="https://drive.usercontent.google.com/download?id=1BGR0mja2QIQgcgsqnsfEQmIed-6v3Rl-&export=download&confirm=t"
          EXPECTED_SHA="65f89d3496820087b9476c826c0692ecca8b61c45dbe8a05a78d42f44af87cdf"
          if ! curl -fL -o base.ipa "$URL"; then
            echo "::error::Base IPA download failed from $URL"
            exit 1
          fi
          ls -la base.ipa
          ACTUAL_SHA=$(shasum -a 256 base.ipa | awk '{print $1}')
          if [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
            echo "::error::Base IPA SHA-256 mismatch: got $ACTUAL_SHA, expected $EXPECTED_SHA"
            exit 1
          fi
          echo "Base IPA SHA-256 verified."

      - name: Verify patch table against the base IPA
        run: |
          python3 scripts/verify_patch_table.py patch_table_verified.json --ipa base.ipa

      - name: Unpack IPA
        run: |
          mkdir -p work && cd work
          unzip -q ../base.ipa
          ls Payload/
          APP=$(ls -d Payload/*.app)
          echo "APP=$APP" >> $GITHUB_ENV
          # Record UnityFramework hash BEFORE any modification.
          shasum -a 256 "$APP/Frameworks/UnityFramework.framework/UnityFramework" | awk '{print $1}' | tee ../unity-before.txt

      - name: Inject dylib load command (LIEF) & patch Info.plist (120Hz + Photos)
        run: |
          python3 -m pip install --break-system-packages lief
          python3 scripts/inject_dylib.py "work/$APP" "@executable_path/Frameworks/ForgeTaxCheat.dylib"
          mkdir -p "work/$APP/Frameworks"
          cp ForgeTaxCheat.dylib "work/$APP/Frameworks/ForgeTaxCheat.dylib"
          # Unlock native 120Hz ProMotion on iPhone 13 Pro+ / iPad Pro (iOS 15+)
          # and add Photos permission strings for saving the MoMo support QR image,
          # without touching UnityFramework.
          PLIST="work/$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CADisableMinimumFrameDurationOnPhone true" "$PLIST" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Add :CADisableMinimumFrameDurationOnPhone bool true" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :NSPhotoLibraryAddUsageDescription Cho phép lưu mã QR ủng hộ vào Thư viện ảnh." "$PLIST" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryAddUsageDescription string Cho phép lưu mã QR ủng hộ vào Thư viện ảnh." "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :NSPhotoLibraryUsageDescription Cho phép lưu mã QR ủng hộ vào Thư viện ảnh." "$PLIST" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryUsageDescription string Cho phép lưu mã QR ủng hộ vào Thư viện ảnh." "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :CADisableMinimumFrameDurationOnPhone" "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :NSPhotoLibraryAddUsageDescription" "$PLIST"

      - name: Assert UnityFramework unchanged
        run: |
          shasum -a 256 "work/$APP/Frameworks/UnityFramework.framework/UnityFramework" | awk '{print $1}' | tee unity-after.txt
          diff unity-before.txt unity-after.txt || {
            echo "::error::UnityFramework changed during the build — refusing to ship."
            exit 1
          }

      - name: Repack IPA
        run: |
          cd work
          zip -r -y ../ForgeTax-Cheat-3.16.1.ipa Payload >/dev/null
          cd ..
          shasum -a 256 ForgeTax-Cheat-3.16.1.ipa | tee ForgeTax-Cheat-3.16.1.ipa.sha256
          ls -la ForgeTax-Cheat-3.16.1.ipa

      - name: Fake-sign with ldid (TrollStore entitlements + best effort)
        run: |
          brew install ldid || true
          if command -v ldid >/dev/null; then
            EXE_NAME=$(basename "$APP" .app)
            cat > /tmp/trollstore-entitlements.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>com.apple.developer.team-identifier</key>
            <string>8C44S5HXT5</string>
            <key>application-identifier</key>
            <string>8C44S5HXT5.com.soucean.fruityzoo</string>
            <key>get-task-allow</key>
            <true/>
          </dict>
          </plist>
          EOF
            ldid -S/tmp/trollstore-entitlements.plist "work/$APP/$EXE_NAME" || echo "::warning::ldid failed on the main executable — IPA still uploaded."
            ldid -S "work/$APP/Frameworks/ForgeTaxCheat.dylib" || echo "::warning::ldid failed on the dylib."
            # Assert UnityFramework was NOT touched by ldid.
            shasum -a 256 "work/$APP/Frameworks/UnityFramework.framework/UnityFramework" | awk '{print $1}' | tee unity-after-ldid.txt
            diff unity-before.txt unity-after-ldid.txt || {
              echo "::error::UnityFramework changed during ldid — refusing to ship."
              exit 1
            }
            # Re-pack cleanly after signing (signing rewrites files in place).
            rm -f ForgeTax-Cheat-3.16.1.ipa
            cd work
            zip -r -y ../ForgeTax-Cheat-3.16.1.ipa Payload >/dev/null
            cd ..
            shasum -a 256 ForgeTax-Cheat-3.16.1.ipa | tee ForgeTax-Cheat-3.16.1.ipa.sha256
          else
            echo "::warning::ldid not available — IPA uploaded unsigned (TrollStore install may still work)."
          fi

      - name: Assert LC_LOAD_DYLIB and dylib present in final IPA
        # Independent check that the cheat actually loads: read the main
        # executable out of the FINAL repacked IPA (after ldid re-pack)
        # and fail if it has no load command for ForgeTaxCheat.dylib.
        run: |
          rm -rf /tmp/final-ipa-check && mkdir -p /tmp/final-ipa-check
          unzip -q ForgeTax-Cheat-3.16.1.ipa -d /tmp/final-ipa-check
          EXE="/tmp/final-ipa-check/$APP/$(basename "$APP" .app)"
          DYLIB="/tmp/final-ipa-check/$APP/Frameworks/ForgeTaxCheat.dylib"
          if [ ! -f "$DYLIB" ]; then
            echo "::error::Final IPA is missing $DYLIB"
            exit 1
          fi
          if ! otool -l "$EXE" | grep -q "@executable_path/Frameworks/ForgeTaxCheat.dylib"; then
            echo "::error::Final IPA has no LC_LOAD_DYLIB for @executable_path/Frameworks/ForgeTaxCheat.dylib in $EXE"
            otool -l "$EXE" | grep -i "dylib" || true
            exit 1
          fi
          echo "LC_LOAD_DYLIB and Frameworks/ForgeTaxCheat.dylib present in final IPA."

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ForgeTax-Cheat-3.16.1.ipa
          path: |
            ForgeTax-Cheat-3.16.1.ipa
            ForgeTax-Cheat-3.16.1.ipa.sha256

      - name: Publish release (this repo)
        # The cloud browser cannot attach 150 MB files to a GitHub release
        # (no file picker), so the workflow publishes the finished IPA
        # itself on the repo it runs on (the huyzoz build fork).
        # Uses the default GITHUB_TOKEN (needs contents: write).
        run: |
          export GH_TOKEN="${{ github.token }}"
          if gh release view v3.16.1-cheat >/dev/null 2>&1; then
            gh release upload v3.16.1-cheat --clobber \
              ForgeTax-Cheat-3.16.1.ipa ForgeTax-Cheat-3.16.1.ipa.sha256
          else
            gh release create v3.16.1-cheat \
              --title "ForgeTax iOS 3.16.1 — Cheat" \
              --notes-file RELEASE-NOTES.md \
              ForgeTax-Cheat-3.16.1.ipa ForgeTax-Cheat-3.16.1.ipa.sha256
          fi
          gh release view v3.16.1-cheat --json tagName,url,assets --jq '{url, assets: [.assets[] | .name]}'
